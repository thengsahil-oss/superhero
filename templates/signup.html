<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-card { background-color: #121212; border-radius: 20px; display: flex; padding: 40px; width: 850px; border: 1px solid #222; }
        
        /* Left Side: Image */
        .img-container { width: 350px; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; border: 2px solid #ff0000; box-shadow: 0 0 20px #ff0000; }

        /* Right Side: Form */
        .form-container { flex: 1; padding-left: 40px; }
        .header-text { color: #ff0000; font-size: 12px; letter-spacing: 2px; }
        h1 { font-size: 40px; margin: 10px 0; }
        .login-link { color: #888; margin-bottom: 20px; }
        .login-link a { color: #ff0000; text-decoration: none; font-weight: bold; }
        
        input { width: 100%; background: #1a1a1a; border: none; padding: 15px; margin-bottom: 15px; color: white; border-radius: 5px; box-sizing: border-box; }
        .name-group { display: flex; gap: 10px; }
        
        button { width: 100%; background-color: #ff0000; color: white; padding: 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="img-container">
        <!-- Ensure this path points to your Scarlet Witch image -->
        <img src="scarlet_witch.jpg" alt="Join The Team">
    </div>
    <div class="form-container">
        <div class="header-text">MARVEL ACCESS</div>
        <h1>JOIN THE TEAM</h1>
        <p class="login-link">Already have an account? <a href="/login">Sign in</a></p>
        
        <div class="name-group">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
        </div>
        <input type="email" placeholder="Email Address">
        <input type="password" placeholder="Password">
        <input type="password" placeholder="Confirm Password">
        
        <button>CREATE ACCOUNT</button>
    </div>
</div>

</body>
</html>
