<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Join The Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f1015;
            --card-bg: #16171d;
            --text-main: #ffffff;
            --text-muted: #8b8d97;
            --input-bg: #ffffff;
            --accent: #ffffff;
        }

        body { 
            margin: 0; display: flex; height: 100vh; 
            background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Space Grotesk', sans-serif;
            align-items: center; justify-content: center;
        }

        .login-card {
            display: flex; width: 1000px; min-height: 600px;
            background: var(--card-bg); border-radius: 24px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .image-side { flex: 1.2; position: relative; }
        .image-side img { width: 100%; height: 100%; object-fit: cover; }

        .form-side { 
            flex: 1; padding: 40px 50px; display: flex;
            flex-direction: column; justify-content: center;
        }

        .form-header { text-align: center; margin-bottom: 40px; }
        h1 { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.2; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { 
            width: 100%; background: var(--input-bg); border: none; 
            padding: 16px 20px; color: #000; border-radius: 12px;
            font-size: 15px; font-family: inherit; box-sizing: border-box;
            outline: none; font-weight: 600;
        }
        .input-group input::placeholder { color: #a0a0a0; font-weight: 400; }
        .input-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #a0a0a0; }

        .btn-signin { 
            width: 100%; padding: 16px; background: var(--accent); color: #000;
            border: none; border-radius: 12px; cursor: pointer; font-weight: 700; 
            font-size: 16px; transition: 0.3s; margin-top: 10px; margin-bottom: 30px;
        }
        .btn-signin:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1); }

        .signup-footer { text-align: center; font-size: 14px; color: var(--text-muted); }
        .signup-footer a { color: white; text-decoration: none; font-weight: 700; }

        .error-message { color: #ff6b6b; font-size: 14px; margin-bottom: 20px; background: rgba(255, 107, 107, 0.1); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid rgba(255, 107, 107, 0.3); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="image-side">
            <img src="{{ url_for('static', filename='avenger.jpg') }}" alt="Avengers Poster">
        </div>

        <div class="form-side">
            <div class="form-header">
                <h1>Join the Team<br>Create Account</h1>
            </div>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form action="/signup" method="POST">
                <div class="input-group">
                    <input type="text" name="name" placeholder="Full Name" required>
                    <i class="fa-regular fa-user input-icon"></i>
                </div>

                <div class="input-group">
                    <input type="email" name="email" placeholder="Enter Email" required>
                    <i class="fa-regular fa-envelope input-icon"></i>
                </div>
                
                <div class="input-group">
                    <input type="password" name="password" placeholder="Create Password" required>
                    <i class="fa-regular fa-eye input-icon"></i>
                </div>
                
                <button type="submit" class="btn-signin">Sign Up</button>
            </form>

            <div class="signup-footer">
                Already have an account? <a href="/login">Sign In!</a>
            </div>
        </div>
    </div>

</body>
</html>
